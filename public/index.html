<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>QR Relay Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 28px;
      width: 420px;
      text-align: center;
    }
    h2 { margin-bottom: 4px; }
    .sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }

    /* Trạng thái */
    .bulb {
      font-size: 56px;
      margin-bottom: 6px;
      filter: grayscale(1) brightness(0.4);
      transition: all 0.4s;
    }
    .bulb.on { filter: none; }
    .status { color: #94a3b8; font-size: 14px; margin-bottom: 4px; }
    .timer {
      font-size: 44px;
      font-weight: bold;
      color: #4ade80;
      min-height: 54px;
      margin-bottom: 20px;
    }

    /* QR tĩnh */
    .qr-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .qr-img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      margin: 0 auto 12px;
      display: block;
      background: white;
      padding: 4px;
    }
    .qr-bank { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    .qr-acct { font-size: 18px; font-weight: bold; color: #f1f5f9; margin-bottom: 2px; }
    .qr-name { font-size: 12px; color: #64748b; margin-bottom: 12px; }

    /* Bảng giá */
    .price-table {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 16px;
    }
    .price-row {
      background: #1e3a5f;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }
    .price-row .amount { color: #38bdf8; font-weight: bold; }
    .price-row .time   { color: #94a3b8; font-size: 11px; }

    /* Test */
    .test-label { color: #475569; font-size: 11px; margin-bottom: 8px; }
    .test-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .test-btn {
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .test-btn:hover { background: #6d28d9; }

    /* Log */
    .log-label { color: #475569; font-size: 11px; text-align: left; margin-bottom: 4px; }
    .log {
      background: #0f172a;
      border-radius: 8px;
      padding: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
      height: 110px;
      overflow-y: auto;
      color: #94a3b8;
    }
    .log .ok   { color: #4ade80; }
    .log .err  { color: #f87171; }
    .log .info { color: #38bdf8; }
  </style>
</head>
<body>
<div class="card">
  <h2>⚡ QR Relay Demo</h2>
  <p class="sub">Quét QR → chuyển khoản → thiết bị tự bật</p>

  <div class="bulb" id="bulb">💡</div>
  <div class="status" id="status">Chờ thanh toán...</div>
  <div class="timer" id="timer"></div>

  <!-- QR tĩnh -->
  <div class="qr-box">
    <img class="qr-img"
      src="https://img.vietqr.io/image/MSB-96886693013299-compact2.png?accountName=PHAM%20TUAN%20VU"
      alt="QR Thanh toán"/>
    <div class="qr-bank">🏦 MSB</div>
    <div class="qr-acct">96886693013299</div>
    <div class="qr-name">PHAM TUAN VU</div>

    <!-- Bảng giá -->
    <div class="price-table">
      <div class="price-row">
        <div class="amount">10.000đ</div>
        <div class="time">⏱ 10 phút</div>
      </div>
      <div class="price-row">
        <div class="amount">20.000đ</div>
        <div class="time">⏱ 20 phút</div>
      </div>
      <div class="price-row">
        <div class="amount">30.000đ</div>
        <div class="time">⏱ 30 phút</div>
      </div>
      <div class="price-row">
        <div class="amount">50.000đ</div>
        <div class="time">⏱ 50 phút</div>
      </div>
    </div>
  </div>

  <!-- Test giả lập -->
  <div class="test-label">🧪 Giả lập thanh toán (chỉ dùng để test)</div>
  <div class="test-btns">
    <button class="test-btn" onclick="simulate(10000)">10.000đ</button>
    <button class="test-btn" onclick="simulate(20000)">20.000đ</button>
    <button class="test-btn" onclick="simulate(30000)">30.000đ</button>
    <button class="test-btn" onclick="simulate(50000)">50.000đ</button>
  </div>

  <div class="log-label">📋 LOG</div>
  <div class="log" id="log"></div>
</div>

<script>
  function log(msg, type = "info") {
    const el = document.getElementById("log");
    const t  = new Date().toLocaleTimeString("vi-VN");
    el.innerHTML += `<div class="${type}">[${t}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  async function simulate(amount) {
    log(`💰 Giả lập ${amount.toLocaleString()}đ...`);
    try {
      const res  = await fetch("/webhook/simulate", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ transferAmount: amount }),
      });
      const data = await res.json();
      if (data.ok) {
        log(`✅ Relay BẬT! Còn ${data.totalLeft} phút`, "ok");
      } else {
        log(`❌ ${data.message || JSON.stringify(data)}`, "err");
      }
    } catch {
      log("❌ Không kết nối được server", "err");
    }
  }

  setInterval(async () => {
    try {
      const res  = await fetch("/status");
      const data = await res.json();
      const bulb   = document.getElementById("bulb");
      const status = document.getElementById("status");
      const timer  = document.getElementById("timer");

      if (data.active) {
        bulb.className = "bulb on";
        status.textContent = "🟢 Thiết bị đang chạy";
        const m = Math.floor(data.secondsLeft / 60);
        const s = data.secondsLeft % 60;
        timer.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      } else {
        bulb.className = "bulb";
        status.textContent = "Chờ thanh toán...";
        timer.textContent  = "";
      }
    } catch {}
  }, 1000);
</script>
</body>
</html>
